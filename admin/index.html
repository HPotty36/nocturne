<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' blob: data:; connect-src https://api.github.com https://nocturne-auth.72chili.workers.dev http://127.0.0.1:*; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex">
<title>Nocturne 관리</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="theme-color" content="#000">
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400&display=swap" crossorigin>
<link rel="stylesheet" href="admin.css">
<script type="module" src="app.js"></script>
</head>
<body>

<header class="bar">
  <div class="bar-in">
    <h1 class="brand"><a class="mark" href="../" target="_blank" rel="noopener">Nocturne</a><span class="brand-sub">관리</span></h1>
    <button class="btn btn-quiet" id="logout" type="button" hidden>로그아웃</button>
  </div>
</header>

<main class="page">
  <p class="msg" id="boot">불러오는 중…</p>

  <!-- not logged in: the button goes to GitHub, which sends the person back here -->
  <section class="gate" id="login" aria-labelledby="login-title" hidden>
    <h2 class="gate-title" id="login-title">로그인</h2>
    <p class="gate-note">GitHub 계정으로 들어가요. 이 저장소에 쓸 수 있는 계정만 관리할 수 있어요.</p>
    <p class="gate-note" id="login-shared" hidden></p>
    <button class="btn btn-main" id="login-start" type="button" aria-describedby="login-msg">GitHub로 로그인</button>
    <p class="msg" id="login-msg" role="status" aria-live="polite"></p>
  </section>

  <!-- logged in -->
  <section class="desk" id="desk" aria-label="관리" hidden>
    <p class="site-status" id="site-status" role="status" aria-live="polite" hidden>
      <span id="site-status-text"></span>
      <a id="site-status-link" target="_blank" rel="noopener noreferrer" hidden>자세히 보기</a>
    </p>
    <div class="tabs" role="tablist" aria-label="관리 화면">
      <button class="tab" id="tab-new" type="button" role="tab" aria-selected="true" aria-controls="panel-new">새 사진</button>
      <button class="tab" id="tab-exhibit" type="button" role="tab" aria-selected="false" aria-controls="panel-exhibit" tabindex="-1">전시 중</button>
    </div>
    <div class="panel" id="panel-new" role="tabpanel" aria-labelledby="tab-new"></div>
    <div class="panel" id="panel-exhibit" role="tabpanel" aria-labelledby="tab-exhibit" hidden></div>
  </section>
</main>

</body>
</html>
