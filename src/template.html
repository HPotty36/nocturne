<style>
/* Nocturne: a black exhibition room in one serif. From 960px a narrow column (the name set large and
   vertically, the rooms, fine print) stays at the left while the photos scroll on the right; below that a
   one-line bar keeps the name, the language link and a drop-down room index at the top. A cover print
   fills its frame, then each room hangs its prints at their own ratios in justified rows, each with a
   "title, date" label, while the room's name stands vertically beside them and follows them down.
   Strong and dim ink do the work an accent colour would: there is none. */
:root {
  color-scheme: dark;
  --ground: #000;
  --wall: #111;
  --ink: #ebe9e4;
  --ink-dim: #8f8c86;
  --rule: #262624;

  --serif: "Noto Serif KR", "Nanum Myeongjo", "AppleMyungjo", "Batang", serif;
  --edge: clamp(16px, 3vw, 40px);  /* outer margin of the page */
  --gap: clamp(10px, 1.3vw, 16px);  /* between prints */
  --bar: 52px;                      /* the phone bar; there is none from 960px */
  --lead: 8px;                      /* above the cover, and above a room jumped to from the index */
}

*, *::before, *::after { box-sizing: border-box; }
html { scrollbar-gutter: stable; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
@media (prefers-reduced-motion: no-preference) {
  html { scroll-behavior: smooth; }
}
html.lb-open { overflow: hidden; }
[hidden] { display: none !important; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font: 400 14px/1.6 var(--serif);
  font-variant-numeric: tabular-nums;
  word-break: keep-all;  /* break Korean between words, not syllables */
  overflow-wrap: break-word;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
a { color: inherit; text-decoration: none; transition: color 0.15s ease; }
a:hover { color: var(--ink); }
button { font: inherit; color: inherit; }
ul { list-style: none; margin: 0; padding: 0; }
figure, h2, p { margin: 0; }
h2 { font: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

/* ---------- phone bar: name left; language and the room index right ---------- */
.side {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  column-gap: 20px;
  height: calc(var(--bar) + env(safe-area-inset-top, 0px));
  padding: env(safe-area-inset-top, 0px) var(--edge) 0;
  background: var(--ground);
}
.mark { margin-right: auto; padding-block: 9px; font-size: 20px; line-height: 1.2; }  /* 42px to a thumb, and room for the focus ring inside the bar */
.lang { order: 1; padding-block: 9px; color: var(--ink-dim); }
.side nav { order: 2; }
.menu summary {
  display: block;
  padding-block: 9px;
  color: var(--ink-dim);
  list-style: none;
  cursor: pointer;
  transition: color 0.15s ease;
}
.menu summary::-webkit-details-marker { display: none; }
.menu summary:hover, .menu[open] summary { color: var(--ink); }
.menu .rooms {  /* drops from the bottom of the bar, its right edge on the page margin */
  position: absolute;
  top: 100%;
  right: var(--edge);
  min-width: 9em;
  padding: 6px 18px;
  background: var(--ground);
  border: 1px solid var(--rule);
}
.menu .rooms a { display: block; padding-block: 9px; color: var(--ink-dim); }
.menu .rooms a:hover, .menu .rooms a.is-here { color: var(--ink); }
.rooms-side, .fine { display: none; }

.main { padding: var(--lead) var(--edge) 0; container-type: inline-size; }

/* ---------- cover: fills its frame (a phone: edge to edge, 4:5; from 960px: the column, down to the bottom of
   the first screen), cropped around the focus the AI chose (--fx --fy); the viewer shows it whole ---------- */
.cover { margin: 0 calc(var(--edge) * -1) clamp(72px, 9vw, 120px); }
.cover .label { padding-inline: var(--edge); }
.cover-btn {
  display: block;
  width: 100%;
  aspect-ratio: 4 / 5;
  max-height: calc(100svh - var(--bar) - env(safe-area-inset-top, 0px) - var(--lead) - 28px);  /* sideways, or a low window: no taller than the first screen */
  padding: 0;
  border: 0;
  cursor: zoom-in;
  background: var(--c, var(--wall));
}
.cover-btn img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: var(--fx, 50%) var(--fy, 50%);
}

/* ---------- rooms: the name stands vertically in a narrow column at the left of the hang and follows the room
   down (under the bar on a phone); its count and span run on below it ---------- */
.room {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  column-gap: 10px;
  align-items: start;
  scroll-margin-top: calc(var(--bar) + env(safe-area-inset-top, 0px) + var(--lead));  /* clear of the bar */
}
.room + .room { margin-top: clamp(96px, 11vw, 160px); }
.room:last-of-type { min-height: 50vh; min-height: 50svh; }  /* tall enough to reach the middle of the screen and be marked */
.room-head {
  position: sticky;
  top: calc(var(--bar) + env(safe-area-inset-top, 0px) + var(--lead));
  writing-mode: vertical-rl;
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.room-head h2 { font-size: 28px; font-weight: 300; line-height: 1; }
.room-meta { display: flex; gap: 10px; font-size: 12px; color: var(--ink-dim); }
/* the count's number stands upright; the span lies on its side. The `digits` form of text-combine-upright would say
   this on .room-count alone, but no browser takes it, so the number has its own span: two digits share one
   character's space, three or more stack */
.room-n { text-combine-upright: all; }
.room-n.is-long { text-combine-upright: none; text-orientation: upright; }

/* justified hang: JS sets each print's width and its photo's height (then adds .is-laid);
   without JS every photo stands at a fixed height in its own ratio */
.hang {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  gap: var(--gap);
}
.print { flex: 0 0 auto; min-width: 0; max-width: 100%; }
.print-btn {
  display: block;
  max-width: 100%;
  height: 180px;
  aspect-ratio: var(--r);
  padding: 0;
  border: 0;
  cursor: zoom-in;
  background: var(--c, var(--wall));
  scroll-margin-block: calc(var(--bar) + env(safe-area-inset-top, 0px) + var(--gap)) var(--gap);
}
.hang.is-laid .print-btn { width: 100%; aspect-ratio: auto; }
.print-btn img { display: block; width: 100%; height: 100%; object-fit: cover; }
.print-btn img, .cover-btn img { transition: opacity 0.6s ease; }
.is-loading img { opacity: 0; }

/* wall label: "title, date", the date dim */
.label { padding-top: 7px; font-size: 13px; line-height: 1.5; }
.label-date { color: var(--ink-dim); }

.foot {
  margin-top: clamp(64px, 8vw, 104px);
  padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px));
  font-size: 12px;
  color: var(--ink-dim);
}
.foot .foot-admin { text-decoration: underline; text-underline-offset: 0.2em; }  /* tells it from the fine print around it */

/* ---------- wide screens: the side column stays while the photos scroll ---------- */
@media (min-width: 960px) {
  :root { --bar: 0px; --lead: var(--edge); --bleed: 16px; }
  .shell {
    display: grid;
    grid-template-columns: 180px minmax(0, 1fr);
    column-gap: clamp(32px, 4vw, 64px);
    align-items: start;
    padding-inline: var(--edge);
  }
  .side {
    z-index: auto;
    flex-direction: column;
    align-items: flex-start;
    height: 100vh;
    height: 100svh;
    padding: var(--edge) var(--bleed);  /* the name starts level with the top of the cover */
    margin-inline: calc(var(--bleed) * -1);  /* the padding is room for the bullet and focus rings only: the text stays put */
    overflow-y: auto;  /* a low window or many rooms: this column scrolls, so its fine print is never cut off */
    scrollbar-width: thin;
    scrollbar-color: var(--ink-dim) transparent;
  }
  .mark, .lang { margin-right: 0; padding-block: 0; }
  /* the name, vertical and large; it follows the window's height too, so the column's fine print still fits a low
     window (the name is about 4.6em long, 22rem is what the rest of the column needs) */
  .side .mark {
    writing-mode: vertical-rl;
    font-size: max(56px, min(7.6vw, 124px, (100svh - 22rem) / 4.6));
    font-weight: 300;
    line-height: 1;
    margin-left: -0.06em;  /* the first letter's side bearing: its stem lines up with the room list */
  }
  .side nav, .lang { order: 0; }
  .side nav { align-self: stretch; margin-top: 36px; }
  .menu { display: none; }
  .rooms-side { display: block; }
  .rooms-side a { position: relative; display: block; padding-block: 3px; color: var(--ink-dim); }
  .rooms-side a:hover, .rooms-side a.is-here { color: var(--ink); }
  .rooms-side a.is-here::before {  /* hung outside the text; the second declaration (alt text "") keeps it out of what a screen reader says */
    content: "\2022"; content: "\2022" / "";
    position: absolute;
    left: -14px;
  }
  .lang { margin-top: 28px; }
  .fine { display: block; margin-top: auto; font-size: 12px; color: var(--ink-dim); }
  .main { padding: var(--lead) 0 clamp(64px, 8vw, 104px); }
  .foot { display: none; }
  .cover { margin-inline: 0; }
  .cover .label { padding-inline: 0; }
  .cover-btn { aspect-ratio: auto; max-height: none; height: calc(100svh - 2 * var(--edge) - 28px); }  /* the label's line stays on the first screen */
  .room { column-gap: clamp(20px, 2.4vw, 36px); }
  .room-head, .room-meta { gap: 14px; }
  .room-head h2 { font-size: clamp(40px, 4vw, 60px); }
}

/* ---------- viewing room: the photo as large as it fits, one line of text under it ---------- */
.lb {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: grid;
  grid-template-rows: minmax(0, 1fr) auto;
  row-gap: 10px;
  padding:
    calc(env(safe-area-inset-top, 0px) + var(--edge))
    var(--edge)
    calc(env(safe-area-inset-bottom, 0px) + 10px);
  background: var(--ground);
}
.lb-stage {
  position: relative;
  min-height: 0;
  touch-action: pan-y pinch-zoom;
  user-select: none;
  -webkit-user-select: none;
}
.lb-img {
  position: absolute;
  inset: 0;
  display: block;
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  margin: auto;
  object-fit: contain;
  -webkit-user-drag: none;
}
/* caption left; count and the three text buttons right (on a line of their own when it is narrow) */
.lb-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  column-gap: 24px;
  font-size: 13px;
  line-height: 1.5;
}
.lb-caption { min-width: 0; }
.lb-date, .lb-nav { color: var(--ink-dim); }
.lb-nav { margin-left: auto; white-space: nowrap; }
.lb-count { margin-right: 12px; }
.lb-link {
  padding: 11px 0;  /* at least 40px tall to a thumb */
  border: 0;
  background: none;
  color: var(--ink-dim);
  cursor: pointer;
  transition: color 0.15s ease;
}
.lb-link:hover, .lb-link:focus-visible { color: var(--ink); }
@media (min-width: 960px) {
  .lb { row-gap: 14px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); }
  .lb-link { padding-block: 3px; }  /* at least 24px tall to a pointer */
}
@media (pointer: coarse) {
  .lb-link { min-height: 40px; }  /* a finger on a wide screen (a tablet) still gets 40px */
}

@media (prefers-reduced-motion: reduce) {
  a, .menu summary, .lb-link, .print-btn img, .cover-btn img { transition: none; }
}
</style>
</head>
<body>
<div class="shell" id="top">
  <aside class="side">
    <a class="mark" href="#top">__TITLE__</a>
    <nav aria-label="__NAVLABEL__">
      <details class="menu"><summary>__MENU__</summary><ul class="rooms">__NAV__</ul></details>
      <ul class="rooms rooms-side">__NAV__</ul>
    </nav>
    <a class="lang" href="__SWITCHHREF__" lang="__SWITCHLANG__" hreflang="__SWITCHLANG__">__SWITCH__</a>
    <p class="fine">__TOTALTEXT__<br>__COPYRIGHT__<br><a class="foot-admin" href="__BASE__admin/">__ADMIN__</a></p>
  </aside>
  <main class="main">
__COVER__
__ROOMS__
    <footer class="foot">__TOTALTEXT__ · __COPYRIGHT__ · <a class="foot-admin" href="__BASE__admin/">__ADMIN__</a></footer>
  </main>
</div>
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="__VIEWERLABEL__" hidden>
  <div class="lb-stage" id="lb-stage"><img class="lb-img" id="lb-img" alt=""></div>
  <div class="lb-bar">
    <p class="lb-caption" aria-live="polite"><span id="lb-title"></span><span class="lb-date" id="lb-date"></span></p>
    <p class="lb-nav"><span class="lb-count" id="lb-count"></span> <button class="lb-link" id="lb-prev" type="button">__PREV__</button> · <button class="lb-link" id="lb-next" type="button">__NEXT__</button> · <button class="lb-link" id="lb-close" type="button">__CLOSE__</button></p>
  </div>
</div>

<script>
(function () {
  var all = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };

  /* ---------- fade photos in as they arrive ---------- */
  all('.print-btn img, .cover-btn img').forEach(function (img) {
    if (img.complete && img.naturalWidth) return;
    var holder = img.parentElement;
    holder.classList.add('is-loading');
    var done = function () { holder.classList.remove('is-loading'); };
    img.addEventListener('load', done, { once: true });
    img.addEventListener('error', done, { once: true });
  });

  /* ---------- justified hang ---------- */
  var CAP = 1.6;  // a row taller than CAP x target keeps the target height and stops short

  function targetHeight(w) {
    if (w >= 1100) return 300;
    if (w >= 720) return 240;
    return w < 400 ? 150 : 180;  // a phone's hang is narrower by the room name's column: keep two prints a row
  }

  function layoutHang(hang, W) {
    var items = all('.print', hang).map(function (el) {
      return { el: el, btn: el.querySelector('.print-btn'), r: parseFloat(el.dataset.w) / parseFloat(el.dataset.h) };
    });
    var n = items.length;
    if (!n) return;  // a room with no photos yet has nothing to hang
    var gap = parseFloat(getComputedStyle(hang).columnGap) || 0;
    var T = targetHeight(W);

    /* split the prints into consecutive rows whose heights stay as close to the target as
       possible; only the last row may be too short to fill the width (it gets capped) */
    var best = [0], cut = [0];
    for (var i = 1; i <= n; i++) {
      best[i] = Infinity;
      var s = 0;
      for (var j = i - 1; j >= 0; j--) {
        s += items[j].r;
        var h = (W - gap * (i - j - 1)) / s;
        if (h > T * CAP && i < n) continue;
        var c = best[j] + Math.pow(Math.log(h / T), 2);
        if (c < best[i]) { best[i] = c; cut[i] = j; }
      }
    }
    var rows = [];
    for (var end = n; end > 0; end = cut[end]) {
      var list = items.slice(cut[end], end);
      var sum = list.reduce(function (acc, it) { return acc + it.r; }, 0);
      var rh = (W - gap * (list.length - 1)) / sum;
      rows.unshift(rh > T * CAP ? { items: list, h: T, full: false } : { items: list, h: rh, full: true });
    }

    rows.forEach(function (row) {
      row.items.forEach(function (it, k) {
        it.el.style.width = Math.floor(row.h * it.r) + 'px';
        it.el.style.flexGrow = (row.full && k === row.items.length - 1) ? '1' : '0';
        it.btn.style.height = row.h.toFixed(2) + 'px';
      });
    });
    hang.classList.add('is-laid');
  }

  var hangs = all('.hang');
  var widths = new WeakMap();
  var relayout = function (hang) {
    var W = Math.floor(hang.getBoundingClientRect().width);
    if (!W || widths.get(hang) === W) return;
    widths.set(hang, W);
    layoutHang(hang, W);
  };
  hangs.forEach(relayout);
  if ('ResizeObserver' in window) {
    var ro = new ResizeObserver(function (entries) {
      entries.forEach(function (e) { relayout(e.target); });
    });
    hangs.forEach(function (h) { ro.observe(h); });
  } else {
    window.addEventListener('resize', function () { hangs.forEach(relayout); });
  }

  /* ---------- the room in view is marked in both room lists ---------- */
  var rooms = all('.room');
  var links = {};  // room id -> its links in the phone menu and the side list
  all('.rooms a').forEach(function (a) {
    var id = a.getAttribute('href').slice(1);
    (links[id] = links[id] || []).push(a);
  });
  var here = null;

  function mark(room, on) {
    ((room && links[room.id]) || []).forEach(function (a) {
      a.classList.toggle('is-here', on);
      if (on) a.setAttribute('aria-current', 'true');
      else a.removeAttribute('aria-current');
    });
  }

  function light(room) {
    if (room === here) return;
    mark(here, false);
    here = room;
    mark(here, true);
  }

  /* the current room is the last one whose top has passed the middle of the screen */
  function update() {
    var line = window.innerHeight / 2, cur = null;
    rooms.forEach(function (r) { if (r.getBoundingClientRect().top <= line) cur = r; });
    light(cur);
  }
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(update, { rootMargin: '-45% 0px -50% 0px' });
    rooms.forEach(function (r) { io.observe(r); });
  }

  /* ---------- the language link remembers the choice for the next visit to the site root ---------- */
  var lang = document.querySelector('.lang');
  if (lang) lang.addEventListener('click', function () {
    try { localStorage.setItem('nocturne.lang', lang.getAttribute('lang')); } catch (e) {}  // blocked: just not remembered
  });

  /* ---------- phone room index: folds up on a pick, on Escape, on a tap outside it and when focus leaves it ---------- */
  var menu = document.querySelector('.menu');
  var fold = function () { if (menu) menu.open = false; };
  if (menu) {
    all('a', menu).forEach(function (a) { a.addEventListener('click', fold); });

    /* A press outside folds the menu and does nothing else: the click it ends in is stopped before it reaches the
       link or photo under it. A press that turns into a scroll (pointercancel), or a key, leaves nothing to stop. */
    var folding = false;
    document.addEventListener('pointerdown', function (e) {
      folding = menu.open && !menu.contains(e.target);
      if (folding) fold();
    });
    document.addEventListener('pointercancel', function () { folding = false; });
    document.addEventListener('keydown', function () { folding = false; });
    document.addEventListener('click', function (e) {
      if (!folding) return;
      folding = false;
      e.preventDefault();
      e.stopPropagation();
    }, true);

    /* Focus leaving the menu (Tab or Shift+Tab out of it, a click that moves focus away) folds it. A press inside it
       may take focus off the summary without leaving the menu (Safari does not focus what is pressed): not a leave. */
    var pressing = false;
    menu.addEventListener('pointerdown', function () { pressing = true; });
    ['pointerup', 'pointercancel'].forEach(function (type) {
      document.addEventListener(type, function () { pressing = false; });
    });
    menu.addEventListener('focusout', function (e) {
      if (!pressing && menu.open && !menu.contains(e.relatedTarget) && document.hasFocus()) fold();
    });
  }

  /* ---------- viewing room ---------- */
  var prints = all('.hang .print');
  var N = prints.length;
  var lb = document.getElementById('lb');
  var lbImg = document.getElementById('lb-img');
  var lbTitle = document.getElementById('lb-title');
  var lbDate = document.getElementById('lb-date');
  var lbCount = document.getElementById('lb-count');
  var btnClose = document.getElementById('lb-close');
  var btnPrev = document.getElementById('lb-prev');
  var btnNext = document.getElementById('lb-next');
  var stage = document.getElementById('lb-stage');
  var idx = -1;
  var lastFocus = null;

  function preload(i) {
    var im = new Image();
    im.src = prints[(i + N) % N].dataset.full;
  }

  /* the English page falls back to the Korean text where there is no English yet; say so */
  function setLang(el, value) {
    if (value) el.setAttribute('lang', value);
    else el.removeAttribute('lang');
  }

  function show(i) {
    idx = (i + N) % N;
    var p = prints[idx];
    var thumb = p.querySelector('img');
    var want = idx;
    lbImg.src = p.dataset.thumb;  // the thumbnail is already here; the full copy replaces it once it arrives
    lbImg.alt = thumb.alt;
    setLang(lbImg, thumb.getAttribute('lang'));
    var full = new Image();
    full.onload = function () { if (!lb.hidden && idx === want) lbImg.src = full.src; };  // not once the viewer is shut
    full.src = p.dataset.full;
    lbTitle.textContent = p.dataset.title;
    setLang(lbTitle, p.dataset.titleLang);
    lbDate.textContent = p.dataset.date ? ', ' + p.dataset.date : '';
    lbCount.textContent = (idx + 1) + ' / ' + N;
    preload(idx + 1);
    preload(idx - 1);
  }

  function open(i) {
    fold();
    lastFocus = document.activeElement;
    show(i);
    lb.hidden = false;
    document.documentElement.classList.add('lb-open');
    btnClose.focus();
  }

  function close() {
    lb.hidden = true;
    document.documentElement.classList.remove('lb-open');
    lbImg.removeAttribute('src');
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  prints.forEach(function (p, i) {
    p.querySelector('.print-btn').addEventListener('click', function () { open(i); });
  });
  all('[data-open]').forEach(function (el) {
    el.addEventListener('click', function () {
      var slug = el.getAttribute('data-open');
      var i = prints.findIndex(function (p) { return p.dataset.slug === slug; });
      if (i >= 0) open(i);
    });
  });

  btnClose.addEventListener('click', close);
  btnPrev.addEventListener('click', function () { show(idx - 1); });
  btnNext.addEventListener('click', function () { show(idx + 1); });

  document.addEventListener('keydown', function (e) {
    if (lb.hidden) {
      if (e.key === 'Escape' && menu && menu.open) {
        var inside = menu.contains(document.activeElement);
        fold();
        if (inside) menu.querySelector('summary').focus();
      }
      return;
    }
    if (e.key === 'Escape') { e.preventDefault(); close(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); show(idx - 1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); show(idx + 1); }
    else if (e.key === 'Tab') {  // keep focus on the three buttons
      var f = [btnPrev, btnNext, btnClose];
      var at = f.indexOf(document.activeElement);
      e.preventDefault();
      var next = e.shiftKey ? (at <= 0 ? f.length - 1 : at - 1) : (at + 1) % f.length;
      f[next].focus();
    }
  });

  /* swipe left or right to move; tap the dark area around the photo to close */
  var sx = 0, sy = 0, tracking = false, swiped = false;
  stage.addEventListener('dragstart', function (e) { e.preventDefault(); });  // a mouse drag swipes, never drags the image out
  stage.addEventListener('pointerdown', function (e) {
    tracking = true; swiped = false; sx = e.clientX; sy = e.clientY;
  });
  stage.addEventListener('pointerup', function (e) {
    if (!tracking) return;
    tracking = false;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.2) {
      swiped = true;
      show(dx < 0 ? idx + 1 : idx - 1);
    }
  });
  stage.addEventListener('pointercancel', function () { tracking = false; });
  stage.addEventListener('click', function (e) {
    if (swiped) { swiped = false; return; }
    if (e.target === stage) close();
  });

  /* ---------- install and offline: sw.js keeps the exhibition on the device (not when opened as a file);
     if the browser refuses it (storage blocked, say), the page simply works as before ---------- */
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('__BASE__sw.js').catch(function () {});
  }
})();
</script>
</body>
</html>
