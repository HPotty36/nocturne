<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="__DESCRIPTION__">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@300;500&family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans+KR:wght@400;500&display=swap">
<style>
/* Layout: an exhibition wall. A thin oversized name, one wide cover print, then four rooms
   where every print hangs at its own ratio in justified rows. Night-first palette with a
   sodium-lamp amber used only for focus and the active room. */
:root {
  color-scheme: dark;
  --ground: #0d1013;
  --wall: #161a1e;
  --ink: #e7e4dd;
  --ink-dim: #8e949a;
  --rule: #272c32;
  --lamp: #d9a759;

  /* the viewing room and photo overlays stay dark in both themes */
  --lb-ground: #07080a;
  --lb-ink: #ece9e2;
  --lb-dim: #8e949a;
  --lb-btn: #1b1f24;
  --lb-btn-hover: #2a3037;
  --on-photo: #f2efe8;
  --scrim: rgba(6, 8, 10, 0.62);

  --f-display: "Hahmlet", "Nanum Myeongjo", "AppleMyungjo", "Batang", Georgia, serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

  --gutter: clamp(16px, 4vw, 56px);
  --hang-gap: 10px;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --ground: #e7e9e8;
    --wall: #dcdfdf;
    --ink: #14171a;
    --ink-dim: #575e65;
    --rule: #c5c9cb;
    --lamp: #7d520f;
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --ground: #e7e9e8;
  --wall: #dcdfdf;
  --ink: #14171a;
  --ink-dim: #575e65;
  --rule: #c5c9cb;
  --lamp: #7d520f;
}

@media (prefers-reduced-motion: no-preference) {
  html { scroll-behavior: smooth; }
}
html.lb-open { overflow: hidden; }

/* base reset (the artifact host adds the same rules; kept here so the page stands alone) */
:root {
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
img { max-width: 100%; }
[hidden] { display: none !important; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

.page {
  max-width: 1440px;
  margin: 0 auto;
  padding-inline: var(--gutter);
  padding-block: clamp(28px, 5vw, 64px) 40px;
}

a { color: inherit; }
:focus-visible { outline: 2px solid var(--lamp); outline-offset: 3px; }

/* ---------- masthead ---------- */
.mast { display: grid; gap: 18px; }
.mast-kicker {
  margin: 0;
  font-family: var(--f-mono);
  font-size: 12px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-dim);
}
.mast-name {
  margin: 0;
  font-family: var(--f-display);
  font-weight: 300;
  font-size: clamp(60px, 14vw, 188px);
  line-height: 0.88;
  letter-spacing: -0.02em;
  text-wrap: balance;
}
.mast-foot {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: end;
  gap: 16px 40px;
  padding-top: 16px;
  border-top: 1px solid var(--rule);
}
.mast-lede { margin: 0; max-width: 44ch; color: var(--ink-dim); }
.mast-rooms { display: flex; flex-wrap: wrap; gap: 6px 26px; }
.mast-rooms a {
  display: inline-flex;
  align-items: baseline;
  gap: 6px;
  text-decoration: none;
  font-family: var(--f-display);
  font-weight: 500;
  font-size: 19px;
  line-height: 1.3;
  transition: color 0.2s;
}
.mast-rooms a .n {
  font-family: var(--f-mono);
  font-size: 11px;
  color: var(--ink-dim);
  font-variant-numeric: tabular-nums;
}
.mast-rooms a:hover, .mast-rooms a.is-here { color: var(--lamp); }

/* ---------- cover print ---------- */
.cover { margin: clamp(28px, 4.5vw, 56px) 0 0; }
.cover-btn {
  display: block;
  width: 100%;
  max-width: 100%;
  padding: 0;
  border: 0;
  cursor: zoom-in;
  background: var(--c, var(--wall));
}
.cover-btn img { display: block; width: 100%; height: auto; }
.cover figcaption, .wall-label {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 4px 16px;
  padding-top: 10px;
}
.label-title { font-family: var(--f-display); font-size: 15px; }
.label-meta {
  font-family: var(--f-mono);
  font-size: 12px;
  color: var(--ink-dim);
  font-variant-numeric: tabular-nums;
}

/* ---------- rooms ---------- */
.room { margin-top: clamp(64px, 9vw, 120px); scroll-margin-top: 24px; }
.room-head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr) auto;
  grid-template-areas: "title note count";
  align-items: baseline;
  gap: 8px 32px;
  padding-top: 14px;
  margin-bottom: 22px;
  border-top: 1px solid var(--rule);
}
.room-head h2 {
  grid-area: title;
  margin: 0;
  display: flex;
  align-items: baseline;
  gap: 12px;
  font-family: var(--f-display);
  font-weight: 500;
  font-size: clamp(28px, 3.4vw, 42px);
  line-height: 1.1;
  text-wrap: balance;
}
.room-en {
  font-family: var(--f-mono);
  font-weight: 400;
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-dim);
}
.room-note { grid-area: note; margin: 0; max-width: 46ch; color: var(--ink-dim); min-width: 0; }
.room-count {
  grid-area: count;
  margin: 0;
  font-family: var(--f-mono);
  font-size: 12px;
  color: var(--ink-dim);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* justified hang: JS sets each print's width and height; the fallback is a fixed-height row */
.hang { display: flex; flex-wrap: wrap; gap: var(--hang-gap); }
.print {
  position: relative;
  display: block;
  flex: 0 0 auto;
  height: 240px;
  aspect-ratio: var(--r);
  max-width: 100%;
  padding: 0;
  border: 0;
  overflow: hidden;
  cursor: zoom-in;
  background: var(--c, var(--wall));
  font: inherit;
  color: inherit;
}
.print img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.cover-btn img, .print img { transition: opacity 0.6s ease; }
.is-loading img { opacity: 0; }
.print-cap {
  position: absolute;
  inset: auto 0 0 0;
  padding: 28px 12px 10px;
  text-align: left;
  font-family: var(--f-display);
  font-size: 14px;
  color: var(--on-photo);
  background: linear-gradient(to bottom, transparent, var(--scrim));
  opacity: 0;
  transition: opacity 0.25s ease;
  pointer-events: none;
}
@media (hover: hover) {
  .print:hover .print-cap { opacity: 1; }
}
.print:focus-visible .print-cap { opacity: 1; }
.print:focus-visible { outline-offset: 3px; }

/* ---------- footer ---------- */
.foot {
  margin-top: clamp(64px, 9vw, 120px);
  padding-top: 14px;
  border-top: 1px solid var(--rule);
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 6px 20px;
  font-family: var(--f-mono);
  font-size: 12px;
  color: var(--ink-dim);
}
.foot p { margin: 0; }

/* ---------- viewing room (lightbox) ---------- */
.lb {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  gap: 10px;
  padding:
    calc(env(safe-area-inset-top, 0px) + 10px)
    clamp(10px, 2vw, 24px)
    calc(env(safe-area-inset-bottom, 0px) + 14px);
  background: var(--lb-ground);
  color: var(--lb-ink);
}
.lb-top { display: flex; justify-content: space-between; align-items: center; }
.lb-count {
  font-family: var(--f-mono);
  font-size: 12px;
  letter-spacing: 0.08em;
  color: var(--lb-dim);
  font-variant-numeric: tabular-nums;
}
.lb-stage {
  position: relative;
  min-height: 0;
  touch-action: pan-y pinch-zoom;
  user-select: none;
  -webkit-user-select: none;
}
.lb-img {
  position: absolute;
  inset: 0;
  margin: auto;
  display: block;
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
  transition: opacity 0.18s ease;
  -webkit-user-drag: none;
}
.lb-img.is-swapping { opacity: 0.25; }
.lb-bar {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 14px;
}
.lb-caption { text-align: center; min-width: 0; }
.lb-title {
  margin: 0;
  font-family: var(--f-display);
  font-size: 18px;
  line-height: 1.35;
}
.lb-meta {
  margin: 2px 0 0;
  font-family: var(--f-mono);
  font-size: 12px;
  color: var(--lb-dim);
  font-variant-numeric: tabular-nums;
}
.lb-btn {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: var(--lb-btn);
  color: var(--lb-ink);
  cursor: pointer;
  transition: background 0.15s;
}
.lb-btn:hover { background: var(--lb-btn-hover); }
.lb-btn svg { width: 18px; height: 18px; }

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

@media (max-width: 760px) {
  :root { --hang-gap: 6px; }
  .mast-foot { grid-template-columns: minmax(0, 1fr); }
  .room-head {
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas: "title count" "note note";
  }
}
@media (prefers-reduced-motion: reduce) {
  .cover-btn img, .print img, .print-cap, .lb-img, .mast-rooms a { transition: none; }
}
</style>
</head>
<body>

<div class="page">
  <header class="mast">
    <p class="mast-kicker">__KICKER__</p>
    <h1 class="mast-name">__TITLE__</h1>
    <div class="mast-foot">
      <p class="mast-lede">__LEDE__</p>
      <nav class="mast-rooms" aria-label="전시실">
__NAV__
      </nav>
    </div>
  </header>

__COVER__

  <main>
__ROOMS__
  </main>

  <footer class="foot">
    <p>__COPYRIGHT__</p>
    <p>사진 __TOTAL__점 · 사진을 누르면 크게 볼 수 있어요</p>
  </footer>
</div>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="사진 크게 보기" hidden>
  <div class="lb-top">
    <span class="lb-count" id="lb-count">01 / 20</span>
    <button class="lb-btn" id="lb-close" type="button" aria-label="닫기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="lb-stage" id="lb-stage">
    <img class="lb-img" id="lb-img" alt="">
  </div>
  <div class="lb-bar">
    <button class="lb-btn" id="lb-prev" type="button" aria-label="이전 사진">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="lb-caption" aria-live="polite">
      <p class="lb-title" id="lb-title"></p>
      <p class="lb-meta" id="lb-meta"></p>
    </div>
    <button class="lb-btn" id="lb-next" type="button" aria-label="다음 사진">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>
</div>

<script>
(function () {
  /* ---------- fade prints in as they arrive ---------- */
  document.querySelectorAll('.print img, .cover-btn img').forEach(function (img) {
    if (img.complete && img.naturalWidth) return;
    var holder = img.parentElement;
    holder.classList.add('is-loading');
    var done = function () { holder.classList.remove('is-loading'); };
    img.addEventListener('load', done, { once: true });
    img.addEventListener('error', done, { once: true });
  });

  /* ---------- justified hang ---------- */
  function targetHeight(w) {
    if (w >= 1100) return 330;
    if (w >= 720) return 250;
    return 210;
  }

  function layoutHang(hang) {
    var W = hang.clientWidth;
    if (!W) return;
    var gap = parseFloat(getComputedStyle(hang).columnGap) || 0;
    var T = targetHeight(W);
    var items = Array.prototype.map.call(hang.querySelectorAll('.print'), function (el) {
      return { el: el, r: parseFloat(el.dataset.w) / parseFloat(el.dataset.h) };
    });

    /* split the prints into consecutive rows so every row fills the width and
       row heights stay as close to the target as possible */
    var n = items.length;
    var best = [0], cut = [0];
    for (var i = 1; i <= n; i++) {
      best[i] = Infinity;
      var s = 0;
      for (var j = i - 1; j >= 0; j--) {
        s += items[j].r;
        var h = (W - gap * (i - j - 1)) / s;
        var c = best[j] + Math.pow(Math.log(h / T), 2);
        if (c < best[i]) { best[i] = c; cut[i] = j; }
      }
    }
    var rows = [];
    for (var end = n; end > 0; end = cut[end]) {
      var list = items.slice(cut[end], end);
      var sum = list.reduce(function (acc, it) { return acc + it.r; }, 0);
      rows.unshift({ items: list, h: (W - gap * (list.length - 1)) / sum, full: true });
    }

    rows.forEach(function (row) {
      row.items.forEach(function (it, i) {
        var s = it.el.style;
        s.height = row.h.toFixed(2) + 'px';
        s.width = Math.floor(row.h * it.r) + 'px';
        s.aspectRatio = 'auto';
        s.flexGrow = (row.full && i === row.items.length - 1) ? '1' : '0';
      });
    });
  }

  var hangs = Array.prototype.slice.call(document.querySelectorAll('.hang'));
  var widths = new WeakMap();
  var relayout = function (hang) {
    var w = hang.clientWidth;
    if (widths.get(hang) === w) return;
    widths.set(hang, w);
    layoutHang(hang);
  };
  hangs.forEach(relayout);
  if ('ResizeObserver' in window) {
    var ro = new ResizeObserver(function (entries) {
      entries.forEach(function (e) { relayout(e.target); });
    });
    hangs.forEach(function (h) { ro.observe(h); });
  } else {
    window.addEventListener('resize', function () { hangs.forEach(relayout); });
  }

  /* ---------- room index highlights the room in view ---------- */
  var navLinks = Array.prototype.slice.call(document.querySelectorAll('.mast-rooms a'));
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (!e.isIntersecting) return;
        navLinks.forEach(function (a) {
          a.classList.toggle('is-here', a.getAttribute('href') === '#' + e.target.id);
        });
      });
    }, { rootMargin: '-45% 0px -50% 0px' });
    document.querySelectorAll('.room').forEach(function (r) { io.observe(r); });
  }

  /* ---------- viewing room ---------- */
  var prints = Array.prototype.slice.call(document.querySelectorAll('.hang .print'));
  var N = prints.length;
  var lb = document.getElementById('lb');
  var lbImg = document.getElementById('lb-img');
  var lbTitle = document.getElementById('lb-title');
  var lbMeta = document.getElementById('lb-meta');
  var lbCount = document.getElementById('lb-count');
  var btnClose = document.getElementById('lb-close');
  var btnPrev = document.getElementById('lb-prev');
  var btnNext = document.getElementById('lb-next');
  var stage = document.getElementById('lb-stage');
  var idx = -1;
  var lastFocus = null;
  var pad = function (n) { return (n < 10 ? '0' : '') + n; };

  function preload(i) {
    var p = prints[(i + N) % N];
    var im = new Image();
    im.src = p.dataset.full;
  }

  function show(i) {
    idx = (i + N) % N;
    var p = prints[idx];
    var want = idx;
    lbImg.src = p.dataset.thumb;
    lbImg.alt = p.querySelector('img').alt;
    var full = new Image();
    full.onload = function () { if (idx === want) lbImg.src = full.src; };
    full.src = p.dataset.full;
    lbTitle.textContent = p.dataset.title;
    lbMeta.textContent = p.dataset.meta;
    lbCount.textContent = pad(idx + 1) + ' / ' + pad(N);
    preload(idx + 1);
    preload(idx - 1);
  }

  function open(i) {
    lastFocus = document.activeElement;
    show(i);
    lb.hidden = false;
    document.documentElement.classList.add('lb-open');
    btnClose.focus();
  }

  function close() {
    lb.hidden = true;
    document.documentElement.classList.remove('lb-open');
    lbImg.removeAttribute('src');
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  prints.forEach(function (p, i) {
    p.addEventListener('click', function () { open(i); });
  });
  document.querySelectorAll('[data-open]').forEach(function (el) {
    el.addEventListener('click', function () {
      var slug = el.getAttribute('data-open');
      var i = prints.findIndex(function (p) { return p.dataset.slug === slug; });
      if (i >= 0) open(i);
    });
  });

  btnClose.addEventListener('click', close);
  btnPrev.addEventListener('click', function () { show(idx - 1); });
  btnNext.addEventListener('click', function () { show(idx + 1); });

  document.addEventListener('keydown', function (e) {
    if (lb.hidden) return;
    if (e.key === 'Escape') { e.preventDefault(); close(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); show(idx - 1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); show(idx + 1); }
    else if (e.key === 'Tab') {
      var f = [btnClose, btnPrev, btnNext];
      var at = f.indexOf(document.activeElement);
      e.preventDefault();
      var next = e.shiftKey ? (at <= 0 ? f.length - 1 : at - 1) : (at + 1) % f.length;
      f[next].focus();
    }
  });

  /* swipe left or right to move; tap the dark area around the photo to close */
  var sx = 0, sy = 0, tracking = false, swiped = false;
  stage.addEventListener('pointerdown', function (e) {
    tracking = true; swiped = false; sx = e.clientX; sy = e.clientY;
  });
  stage.addEventListener('pointerup', function (e) {
    if (!tracking) return;
    tracking = false;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.2) {
      swiped = true;
      show(dx < 0 ? idx + 1 : idx - 1);
    }
  });
  stage.addEventListener('pointercancel', function () { tracking = false; });
  stage.addEventListener('click', function (e) {
    if (swiped) { swiped = false; return; }
    if (e.target === stage) close();
  });
})();
</script>
</body>
</html>
