name: Draft

# 올린 사진을 GitHub가 바로 맡는다. 먼저 Claude가 초안을 쓰고 게시하고,
# Claude가 못 쓴 사진만 같은 실행 안에서 e4b(Ollama)가 이어서 쓴다.
# PC 도우미는 올린 지 5분이 지나도 아무도 맡지 않은 사진을 가져간다.
on:
  push:
    branches: [main]
    paths: ['queue/**']
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  draft:
    # 작업이 if로 건너뛰어지면 아래 concurrency 자리를 차지하지 않는다 (PC가 맡는 커밋마다 push가 온다)
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '올림') || contains(github.event.head_commit.message, '다시 시도')
    concurrency:
      group: draft
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # 쓰기 권한이 있는 토큰은 worker 단계와 대표 사진 단계에, Anthropic 키는 Claude 단계와 대표 사진 단계에만 준다
    # (내려받은 Ollama가 도는 단계에는 둘 다 없다).
    # 여기에는 비밀이 아닌 모델 이름만 둔다. Claude 모델을 바꾸려면 아래 값만 고친다
    env:
      NOCTURNE_MODEL: gemma4:e4b-it-qat
      NOCTURNE_CLAUDE_MODEL: claude-opus-5-5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - run: pip install -r requirements.txt

      # 이 설치가 실패해도 e4b 단계는 돈다: Claude 단계는 anthropic을 못 불러와 사진을 e4b로 넘긴다
      # requirements-ai.txt는 버전과 해시로 고정돼 있어서, 적힌 해시와 다른 파일은 설치하지 않는다
      - name: Claude SDK 설치
        continue-on-error: true
        run: pip install --require-hashes -r requirements-ai.txt

      # 먼저 Claude가 맡는다. 키가 없으면 아무것도 맡지 않고 넘어간다 (키를 넣기 전에도 아래 e4b로 돈다).
      # Claude가 못 쓴 사진은 대기로 돌려놓아 아래 e4b 단계가 이어받는다.
      # 이 단계가 통째로 죽어도 e4b 단계는 돌아야 해서 continue-on-error를 둔다
      - name: Claude로 초안 쓰고 게시
        id: claude
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/worker.py --by github --run --ai claude

      # 전시 중인 사진이 바뀌었으면 Claude가 대표 사진과 자를 중심을 다시 고른다 (사람이 고른 대표는 중심만 정한다).
      # 키가 없으면 아무것도 하지 않는다. Ollama를 내려받기 전이라 키가 Ollama가 도는 동안의 단계에 닿지 않는다.
      # e4b나 PC가 게시한 사진은 다음 실행(30분마다)에서 반영된다. 실패해도 대표는 그대로 두고 실행은 이어진다
      - name: 대표 사진 고르기
        id: cover
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/cover.py

      # Claude가 못 쓴 사진(키가 없을 때는 전부)이 남았을 때만 아래 Ollama 단계들이 돈다
      - name: 남은 사진 찾기
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/worker.py --by github --check

      - name: Ollama v0.35.1 내려받기
        if: steps.check.outputs.names != ''
        env:
          # v0.35.1 릴리스의 sha256sum.txt에 적힌 ollama-linux-amd64.tar.zst 값
          OLLAMA_SHA256: 9fcd79ac4575b2bd31b992eee18b1000c8ad126b451627c8f8cd091714cfbb10
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/ollama"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/ollama.tar.zst" \
            https://github.com/ollama/ollama/releases/download/v0.35.1/ollama-linux-amd64.tar.zst
          echo "$OLLAMA_SHA256  $RUNNER_TEMP/ollama.tar.zst" | sha256sum -c -
          tar --zstd -xf "$RUNNER_TEMP/ollama.tar.zst" -C "$dir"
          "$dir/bin/ollama" --version
          echo "$dir/bin" >> "$GITHUB_PATH"
          # runner 값은 job 수준 env에서 쓸 수 없어서 여기서 정한다 (아래 단계들이 이어받는다)
          echo "OLLAMA_MODELS=$RUNNER_TEMP/ollama-models" >> "$GITHUB_ENV"

      - name: 모델 폴더 캐시 불러오기
        id: cache
        if: steps.check.outputs.names != ''
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.OLLAMA_MODELS }}
          key: ollama-gemma4-e4b-it-qat

      - name: Ollama 서버 켜기
        if: steps.check.outputs.names != ''
        run: |
          nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:11434/api/version > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Ollama 서버가 60초 안에 켜지지 않았어요" >&2
          cat "$RUNNER_TEMP/ollama.log" >&2
          exit 1

      - name: 모델 내려받기
        if: steps.check.outputs.names != ''
        run: ollama pull gemma4:e4b-it-qat

      # 받는 데 성공하면 뒤 단계가 실패해도 모델이 남도록 바로 저장한다
      - name: 모델 폴더 캐시 저장
        if: steps.check.outputs.names != '' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.OLLAMA_MODELS }}
          key: ollama-gemma4-e4b-it-qat

      # Claude 단계가 못 쓴 사진은 여기서 실패하면 failed가 된다 (사람이 새 사진 탭에서 다시 시도)
      # 남은 사진 찾기 때 있던 사진만 쓴다. Ollama를 준비하는 사이에 올라온 사진은 다음 실행의 Claude 단계가 쓴다
      # (그 사진의 올림 push로 다음 실행이 이미 줄 서 있다)
      - name: e4b로 초안 쓰고 게시
        id: run
        if: steps.check.outputs.names != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/worker.py --by github --run --ai ollama --only "${{ steps.check.outputs.names }}"

      # GITHUB_TOKEN으로 만든 push는 다른 워크플로를 시작하지 않으므로 직접 부른다
      # (Claude 단계나 e4b 단계 중 하나라도 게시했거나, 대표 사진이나 그 중심이 바뀌었으면)
      - name: 사이트 다시 만들기
        if: ${{ !cancelled() && ((steps.claude.outputs.published != '' && steps.claude.outputs.published != '0') || (steps.run.outputs.published != '' && steps.run.outputs.published != '0') || steps.cover.outputs.changed == '1') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --ref main
